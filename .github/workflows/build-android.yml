name: Crear APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto Android
        run: |
          mkdir -p android_project
          ls -la
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'Mi_Tienda_POS_Android_Fuente*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android"
            exit 1
          fi
          echo "Usando archivo: $ZIP_FILE"
          unzip "$ZIP_FILE" -d android_project
          cp -R android_project/. .

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tienda-POS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
