name: Crear APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto Android
        run: |
          mkdir -p android_project
          ZIP_FILE="Mi_Tienda_POS_CORREGIDO_ANDROID.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encuentra $ZIP_FILE"
            ls -la
            exit 1
          fi

          unzip "$ZIP_FILE" -d android_project
          cp -R android_project/. .

          if [ ! -f "app/build.gradle" ]; then
            echo "ERROR: No se encontró app/build.gradle"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tienda-POS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
